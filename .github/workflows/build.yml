name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build signed APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare APK file
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk apk/Saku-1.0.0-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saku-APK
          path: apk/*.apk

      - name: Commit APK to repo
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "saku-builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/Saku-1.0.0-release.apk
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan APK"
          else
            git commit -m "build: include APK [skip ci]"
            git push
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Saku-APK

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Saku-1.0.0-release.apk
