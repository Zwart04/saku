name: Build APK (Flutter)

on:
  push:
    branches: [main, flutter-rewrite]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter test
        run: flutter test

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build signed APK
        run: flutter build apk --release

      - name: Prepare APK file
        run: |
          mkdir -p apk
          cp build/app/outputs/flutter-apk/app-release.apk apk/Saku-1.1.0-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saku-Flutter-APK
          path: apk/*.apk

      - name: Commit APK to repo
        if: github.event_name == 'push'
        run: |
          git config user.name "saku-builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/Saku-1.1.0-release.apk
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan APK"
          else
            git commit -m "build: include APK [skip ci]"
            git push
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Saku-Flutter-APK

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Saku-1.1.0-release.apk
